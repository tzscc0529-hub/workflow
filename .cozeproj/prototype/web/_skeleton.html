<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #080808;
      --color-primary-container:    #D8D1C4;
      --color-on-primary:           #F4F1EA;
      /* === 背景 / 表面 === */
      --color-background:                 #F4F1EA;
      --color-surface-container-lowest:   #F9F7F3;
      --color-surface:                    #F4F1EA;
      --color-surface-container:          #EDE9E0;
      --color-surface-container-high:     #E5E0D6;
      --color-surface-container-highest:  #DDD7CC;
      /* === 文字 === */
      --color-on-surface:           #111111;
      --color-on-surface-variant:   #6B665E;
      /* === 功能色 === */
      --color-success:  #2d6a4f;
      --color-error:    #8b2500;
      --color-warning:  #7a5d00;
      /* === 边框 === */
      --color-outline:          #D8D1C4;
      --color-outline-variant:  #D8D1C4;
      /* === 圆角 === */
      --radius-sm:   0rem;
      --radius-md:   0rem;
      --radius-lg:   0rem;
      --radius-xl:   0rem;
      --radius-2xl:  0rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 1px 3px rgba(0,0,0,0.10);
      --shadow-float:  0 4px 12px rgba(0,0,0,0.08);
      --shadow-dialog: 0 8px 24px rgba(0,0,0,0.10);
      /* === 字体 === */
      --font-sans: "Georgia", "Noto Serif SC", serif;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end） -->
  <header class="bg-surface-container-lowest sticky top-0 z-40 h-16 flex items-center justify-between px-6 border-b border-outline/30">
    <div class="flex items-center gap-3">
      <i data-lucide="film" class="text-primary w-5 h-5"></i>
      <span class="text-lg tracking-wide text-on-surface" style="font-family: 'Playfair Display', Georgia, serif;">Video Skeleton Analyst</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-on-surface-variant tracking-widest uppercase">v2.0</span>
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary text-xs font-semibold">初</div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 4rem)">
    <aside class="w-56 shrink-0 bg-surface-container-lowest border-r border-outline/30 overflow-y-auto">
      <div class="p-4 space-y-0.5">
        <a href="home.html" class="flex items-center gap-3 px-3 py-2.5 bg-primary text-on-primary text-sm tracking-wide" aria-current="page" style="font-family: 'Playfair Display', Georgia, serif;">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>概览
        </a>
        <a href="analysis.html" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition-colors tracking-wide" style="font-family: 'Playfair Display', Georgia, serif;">
          <i data-lucide="video" class="w-4 h-4"></i>视频分析
        </a>
        <a href="reports.html" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition-colors tracking-wide" style="font-family: 'Playfair Display', Georgia, serif;">
          <i data-lucide="file-text" class="w-4 h-4"></i>分析报告
        </a>
        <a href="knowledge.html" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition-colors tracking-wide" style="font-family: 'Playfair Display', Georgia, serif;">
          <i data-lucide="database" class="w-4 h-4"></i>知识库
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-sm transition-colors tracking-wide" style="font-family: 'Playfair Display', Georgia, serif;">
          <i data-lucide="settings" class="w-4 h-4"></i>系统配置
        </a>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-8">
      <!-- 页面内容 -->
    </main>
    <!-- @main-content:end -->
  </div>

  <script>lucide.createIcons();</script>
</body>

</html>
